<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <span class="brand-mark">G</span>
            <span class="brand-name">Gestionale</span>
          </div>
        </div>
        <nav id="sidebar-nav" class="sidebar-nav">
          <!-- generata da sidebar.js -->
        </nav>
      </aside>

      <div class="main">
        <header class="topbar">
          <button
            id="menu-toggle"
            class="icon-btn"
            aria-label="Apri menu"
          ></button>
          <div class="topbar-title">
            <h1 id="view-title">Dashboard</h1>
            <p id="view-subtitle" class="muted"></p>
          </div>
          <div class="topbar-actions">
            <div class="search-wrap">
              <span class="search-icon"></span>
              <input
                id="search-input"
                class="search-input"
                type="search"
                placeholder="Cerca..."
              />
            </div>
            <button id="btn-new" class="btn btn-primary" type="button">
              <span class="btn-new-icon"></span><span>Nuovo</span>
            </button>
          </div>
        </header>

        <main id="view-content" class="view-content">
          <!-- generato dinamicamente da table-view.js / dashboard -->
        </main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/components/form-modal.js"></script>
    <script src="/js/components/table-view.js"></script>
    <script src="/js/components/dashboard.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
