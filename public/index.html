<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionale</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <span class="brand-mark">G</span>
            <span class="brand-name">Gestionale</span>
          </div>
        </div>
        <nav id="sidebar-nav" class="sidebar-nav">
          <!-- generata da sidebar.js -->
        </nav>
      </aside>

      <div class="main">
        <header class="topbar">
          <button id="menu-toggle" class="icon-btn" aria-label="Apri menu">
            ☰
          </button>
          <div class="topbar-title">
            <h1 id="view-title">Dashboard</h1>
            <p id="view-subtitle" class="muted"></p>
          </div>
          <div class="topbar-actions">
            <input
              id="search-input"
              class="search-input"
              type="search"
              placeholder="Cerca..."
            />
            <button id="btn-new" class="btn btn-primary" type="button">
              + Nuovo
            </button>
          </div>
        </header>

        <main id="view-content" class="view-content">
          <!-- generato dinamicamente da table-view.js / dashboard -->
        </main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <script src="/js/api.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/components/form-modal.js"></script>
    <script src="/js/components/table-view.js"></script>
    <script src="/js/components/dashboard.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
