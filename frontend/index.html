<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionale</title>
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ctext x='16' y='22' font-size='18' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3EG%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <span class="brand-mark">G</span>
            <span class="brand-name">Gestionale</span>
          </div>
        </div>
        <nav id="sidebar-nav" class="sidebar-nav">
          <!-- generata da sidebar.js -->
        </nav>
      </aside>

      <div class="main">
        <header class="topbar">
          <button
            id="menu-toggle"
            class="icon-btn"
            aria-label="Apri menu"
          ></button>
          <div class="topbar-title">
            <h1 id="view-title">Dashboard</h1>
            <p id="view-subtitle" class="muted"></p>
          </div>
          <div class="topbar-actions">
            <div class="search-wrap">
              <span class="search-icon"></span>
              <input
                id="search-input"
                class="search-input"
                type="search"
                placeholder="Cerca..."
              />
            </div>
            <button
              id="theme-toggle"
              class="icon-btn always"
              type="button"
              aria-label="Cambia tema"
            ></button>
            <button id="btn-new" class="btn btn-primary" type="button">
              <span class="btn-new-icon"></span><span>Nuovo</span>
            </button>
          </div>
        </header>

        <main id="view-content" class="view-content">
          <!-- generato dinamicamente da table-view.js / dashboard -->
        </main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/confirm-dialog.js"></script>
    <script src="/js/components/theme.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/components/form-modal.js"></script>
    <script src="/js/components/table-view.js"></script>
    <script src="/js/components/cestino.js"></script>
    <script src="/js/components/dashboard.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
